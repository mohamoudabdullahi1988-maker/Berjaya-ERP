[project]
name = "sidra_realestate"
authors = [
    { name = "Mohamoud Abdullahi Sheikh", email = "mohamoud.abdullahi1988@gmail.com" },
]
description = "Sidra Real Estate on ERPNext: land and house sales, Murabaha / installment contracts, construction projects, brokerage"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I"]
ignore = ["E501", "W191"]

[tool.ruff.format]
indent-style = "tab"
