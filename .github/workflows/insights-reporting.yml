name: Insights reporting package

on:
  pull_request:
    paths:
      - 'integrations/insights/**'
      - 'sidra_realestate/**/doctype/**/*.json'
      - '.github/workflows/insights-reporting.yml'
  push:
    branches: [develop, 'feature/reporting-insights-*']
    paths:
      - 'integrations/insights/**'
      - 'sidra_realestate/**/doctype/**/*.json'
      - '.github/workflows/insights-reporting.yml'

permissions:
  contents: read

jobs:
  workbook-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s integrations/insights/tests -v
