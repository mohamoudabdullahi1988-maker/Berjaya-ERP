name: Staff clients
on: [pull_request, workflow_dispatch]
jobs:
  web-and-location:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: npm test && npm run check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Browser smoke
        run: |
          node tools/serve.mjs > /tmp/sidra-preview.log 2>&1 &
          sidra_preview_pid=$!
          trap 'kill "$sidra_preview_pid"' EXIT
          CHROME_BIN="$(command -v google-chrome)" node tools/browser-smoke.mjs
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: 'platform-tools platforms;android-35 build-tools;35.0.0', log-accepted-android-sdk-licenses: false}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - run: gradle --no-daemon -p native/android :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with: {name: android-debug, path: native/android/app/build/outputs/apk/debug/*.apk}
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: native/macos/package.sh
      - run: ditto -c -k --keepParent 'native/macos/dist/Sidra Homes.app' sidra-macos.zip
      - uses: actions/upload-artifact@v4
        with: {name: macos-local-build, path: sidra-macos.zip}
